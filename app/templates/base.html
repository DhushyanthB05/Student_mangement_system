<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Student Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { min-height: 100vh; background-color: #212529; color: white; padding-top: 20px;}
        .sidebar a { color: #adb5bd; text-decoration: none; padding: 10px 20px; display: block;}
        .sidebar a:hover, .sidebar a.active { color: white; background-color: #343a40; }
        .main-content { padding: 20px; }
    </style>
</head>
<body>
    {% if current_user.is_authenticated %}
    <div class="container-fluid p-0">
        <div class="row g-0">
            <div class="col-md-2 sidebar">
                <h4 class="text-center mb-4">SSMS</h4>
                <a href="{{ url_for('dashboard.index') }}" class="{% if request.endpoint == 'dashboard.index' %}active{% endif %}"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
                <a href="{{ url_for('students.list_students') }}" class="{% if request.blueprint == 'students' %}active{% endif %}"><i class="bi bi-people me-2"></i> Students</a>
                <a href="{{ url_for('courses.list_courses') }}" class="{% if request.blueprint == 'courses' %}active{% endif %}"><i class="bi bi-journal-text me-2"></i> Courses</a>
                <a href="{{ url_for('attendance.index') }}" class="{% if request.blueprint == 'attendance' %}active{% endif %}"><i class="bi bi-calendar-check me-2"></i> Attendance</a>
                <hr class="border-secondary">
                <a href="{{ url_for('auth.logout') }}"><i class="bi bi-box-arrow-right me-2"></i> Logout</a>
            </div>
            <div class="col-md-10 main-content">
                {% include '_messages.html' %}
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>
    {% else %}
        {% include '_messages.html' %}
        {% block auth_content %}{% endblock %}
    {% endif %}
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
