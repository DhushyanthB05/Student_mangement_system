<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(-45deg, #0f172a, #1e293b, #3b82f6, #1d4ed8);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
        
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            width: 100%;
            max-width: 900px;
        }
        
        .login-sidebar {
            background: linear-gradient(135deg, rgba(248, 250, 252, 0.95), rgba(241, 245, 249, 0.95));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 3rem;
            border-right: 1px solid rgba(226, 232, 240, 0.8);
        }
        
        .login-form-area {
            padding: 4rem;
            background: #ffffff;
        }
        
        .form-control {
            padding: 0.8rem 1.2rem;
            border-radius: 0.75rem;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        .form-control:focus {
            background-color: #ffffff;
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }
        
        .input-group-text {
            background-color: #f8fafc;
            border-radius: 0.75rem;
            border-color: #e2e8f0;
            padding-left: 1.2rem;
            padding-right: 0.5rem;
        }
        
        .btn-primary {
            padding: 0.8rem;
            border-radius: 0.75rem;
            font-weight: 600;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
        }
        
        .logo-img {
            max-width: 140px;
            border-radius: 20%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }
        
        .logo-img:hover {
            transform: scale(1.05) rotate(-3deg);
        }
        
        .form-check-input:checked {
            background-color: #2563eb;
            border-color: #2563eb;
        }
        
        .fade-in-up {
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container px-4 fade-in-up">
        <div class="glass-card mx-auto">
            <div class="row g-0">
                <div class="col-md-5 login-sidebar d-none d-md-flex text-center relative">
                    <img src="{{ url_for('static', filename='img/logo.jpg') }}" alt="Logo" class="logo-img mb-4">
                    <h3 class="fw-bold text-dark mb-2">Welcome Back</h3>
                </div>
                
                <div class="col-md-7 login-form-area">
                    <h3 class="fw-bold mb-4">Sign In</h3>
                    
                    {% include "_messages.html" %}
                    
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                        
                        <div class="mb-4">
                            <label for="username" class="form-label fw-bold text-dark small text-uppercase tracking-wide">Username</label>
                            <div class="input-group">
                                <span class="input-group-text border-end-0"><i class="bi bi-person text-primary"></i></span>
                                <input type="text" class="form-control border-start-0 ps-2" id="username" name="username" required placeholder="Enter username">
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <label for="password" class="form-label fw-bold text-dark small text-uppercase tracking-wide">Password</label>
                            <div class="input-group">
                                <span class="input-group-text border-end-0"><i class="bi bi-shield-lock text-primary"></i></span>
                                <input type="password" class="form-control border-start-0 border-end-0 ps-2" id="password" name="password" required placeholder="********">
                                <button class="btn border border-start-0 bg-light text-muted pe-3" type="button" id="togglePassword" style="border-radius: 0 0.75rem 0.75rem 0;">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>
                        
                        <div class="d-flex justify-content-between align-items-center mb-5">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="" id="rememberMe">
                                <label class="form-check-label text-muted small fw-medium" for="rememberMe">
                                    Remember me
                                </label>
                            </div>
                            <a href="#" class="text-decoration-none small fw-bold text-primary">Forgot Password?</a>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 mb-2 py-3">Sign In to Account <i class="bi bi-arrow-right ms-2"></i></button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#password');
        
        togglePassword.addEventListener('click', function (e) {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.innerHTML = type === 'password' ? '<i class="bi bi-eye text-primary"></i>' : '<i class="bi bi-eye-slash text-muted"></i>';
        });
    </script>
</body>
</html>
